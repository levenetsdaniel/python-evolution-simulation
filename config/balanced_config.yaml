# Spatial life cycle with time to forage/mate and a tighter food energy budget.
defaults:
  - sim_config
  - _self_

individual:
  fitness_death_threshold: 0.05
  fitness_death_prob_coef: 0.03
  age_scale: 160.0
  age_death_power: 1.8

spatial:
  food_energy: 3.0
  food_radius: 6.0
  food_regeneration: 10.0
  offspring_energy: 45.0
  mutation_std: 0.06

spatial_guidance:
  shift_strength: 0.3
